<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>非工作时段 · 个人平台</title>
<style>
:root{
  --bg:#0d1117; --bg2:#141b24; --card:#171f29; --card2:#1d2733;
  --line:#26313f; --line2:#334255;
  --tx:#e8edf3; --tx2:#9fb0c3; --tx3:#6b7f96;
  --ac:#f0a04b; --ac2:#ffd08a; --ok:#5ec4a0; --hi:#6aa9f0; --warn:#e87f6b;
  --r:14px; --sh:0 4px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx); font-size:15px; line-height:1.65;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
h1,h2,h3,h4{margin:0;font-weight:650;line-height:1.35}
a{color:var(--hi);text-decoration:none}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:rgba(13,17,23,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:12px;padding:14px 0 12px}
.hd .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,var(--ac),#c96a2e);display:grid;place-items:center;font-weight:800;font-size:15px;color:#231404;flex:0 0 auto}
.hd .t{font-size:16px;font-weight:680;letter-spacing:.2px}
.hd .d{font-size:12px;color:var(--tx3);margin-top:1px}
.hd .sp{flex:1}
.day-badge{font-size:11px;color:var(--ac2);border:1px solid rgba(240,160,75,.32);background:rgba(240,160,75,.09);padding:4px 10px;border-radius:999px;white-space:nowrap}

/* ---------- nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(20,27,36,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;max-width:960px;margin:0 auto}
nav button{flex:1;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--tx3);transition:color .15s}
nav button .ic{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button span{font-size:10.5px;letter-spacing:.3px}
nav button.on{color:var(--ac)}

/* ---------- generic ---------- */
.view{display:none;padding-top:18px;animation:fade .28s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card.tap{cursor:pointer;transition:border-color .18s,transform .18s}
.card.tap:active{transform:scale(.995)}
.card.tap:hover{border-color:var(--line2)}
.eyebrow{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--tx3);font-weight:600;margin-bottom:8px}
.sec-t{font-size:13px;font-weight:650;color:var(--tx2);margin:22px 0 10px;letter-spacing:.4px;display:flex;align-items:center;gap:8px}
.sec-t::after{content:"";flex:1;height:1px;background:var(--line)}
.muted{color:var(--tx2)}
.small{font-size:13px}
.tiny{font-size:12px;color:var(--tx3)}
.chip{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--tx2);border:1px solid var(--line)}
.chip.ac{color:var(--ac2);border-color:rgba(240,160,75,.3);background:rgba(240,160,75,.1)}
.chip.ok{color:var(--ok);border-color:rgba(94,196,160,.3);background:rgba(94,196,160,.1)}
.chip.hi{color:var(--hi);border-color:rgba(106,169,240,.3);background:rgba(106,169,240,.1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:11px;background:var(--card2);border:1px solid var(--line2);font-size:14px;font-weight:550;transition:background .15s;white-space:nowrap}
.btn svg{width:16px;height:16px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn:active{background:var(--line)}
.btn.pri{background:linear-gradient(140deg,var(--ac),#d9812f);color:#231404;border-color:transparent;font-weight:680}
.btn.full{width:100%}
.row{display:flex;gap:9px;flex-wrap:wrap}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 10px;margin:0 -16px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--tx2);white-space:nowrap;transition:.15s}
.pill.on{background:rgba(240,160,75,.13);border-color:rgba(240,160,75,.4);color:var(--ac2);font-weight:600}

/* ---------- today ---------- */
.hero{background:linear-gradient(155deg,#1b2836,#151d27);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
.hero .k{font-size:12px;color:var(--ac2);letter-spacing:1.2px;text-transform:uppercase;font-weight:650}
.hero h2{font-size:23px;margin:8px 0 6px}
.hero p{margin:0;color:var(--tx2);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 4px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center}
.stat b{display:block;font-size:21px;font-weight:700;color:var(--ac2);line-height:1.2}
.stat span{font-size:11px;color:var(--tx3)}

/* ---------- english ---------- */
.grp{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;background:var(--card)}
.grp>summary{padding:13px 15px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ac);flex:0 0 auto}
.grp>summary .n{margin-left:auto;font-size:11px;color:var(--tx3);font-weight:400}
.words{padding:0 8px 8px}
.w{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:9px;border-top:1px solid var(--line)}
.w:hover{background:rgba(255,255,255,.02)}
.w .en{font-weight:600;font-size:14.5px;letter-spacing:.1px}
.w .zh{font-size:13px;color:var(--tx2);margin-top:1px}
.w .sp{flex:1;min-width:0}
.ib{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;border:1px solid var(--line);color:var(--tx3);transition:.15s}
.ib:active{background:var(--card2)}
.ib svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.star.on{color:var(--ac);border-color:rgba(240,160,75,.4);background:rgba(240,160,75,.1)}
.ib.star.on svg{fill:currentColor}
.ph{padding:12px 14px;border-top:1px solid var(--line)}
.ph:first-child{border-top:none}
.ph .en{font-weight:600;font-size:14.5px}
.ph .zh{font-size:13px;color:var(--tx2);margin-top:3px}
.ph .nt{font-size:12px;color:var(--ac2);margin-top:5px;opacity:.85}
.ph .hd2{display:flex;gap:10px;align-items:flex-start}

/* ---------- quiz ---------- */
.qbox{text-align:center;padding:8px 0}
.qq{font-size:26px;font-weight:680;margin:14px 0 22px;line-height:1.4}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-bottom:9px;font-size:15px;transition:.15s}
.opt:active{background:var(--card2)}
.opt.right{border-color:var(--ok);background:rgba(94,196,160,.12)}
.opt.wrong{border-color:var(--warn);background:rgba(232,127,107,.12)}
.prog{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:6px}
.prog i{display:block;height:100%;background:var(--ac);transition:width .3s}

/* ---------- globe ---------- */
#globeWrap{position:relative;width:100%;aspect-ratio:1;max-width:460px;margin:0 auto 6px;touch-action:none}
#globe{width:100%;height:100%;display:block;cursor:grab}
#globe:active{cursor:grabbing}
.ghint{text-align:center;font-size:12px;color:var(--tx3);margin-bottom:12px}

/* ---------- country ---------- */
.cflag{font-size:40px;line-height:1}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;margin:14px 0}
.fact{background:var(--card2);border-radius:10px;padding:10px 12px}
.fact b{display:block;font-size:10.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin-bottom:3px}
.fact span{font-size:13.5px}
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:11px;margin-top:12px}
.ccards.tight{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px}
.cc{background:var(--card2);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.cc .img{height:118px;background:linear-gradient(135deg,#243141,#1a2430);position:relative;overflow:hidden;display:grid;place-items:center}
.cc .img img{width:100%;height:100%;object-fit:cover;display:block}
.cc .img .ph2{font-size:11px;color:var(--tx3);letter-spacing:.5px}
.cc .bd{padding:11px 12px}
.cc .tp{font-size:10.5px;color:var(--ac2);letter-spacing:1px;font-weight:650;text-transform:uppercase}
.cc h4{font-size:14.5px;margin:4px 0 5px}
.cc p{margin:0;font-size:12.5px;color:var(--tx2);line-height:1.55}

/* ---------- retail ---------- */
.ri{border-left:2px solid var(--line2);padding:2px 0 2px 14px;margin-bottom:18px}
.ri h4{font-size:15px;margin-bottom:6px}
.ri p{margin:0 0 8px;font-size:13.5px;color:var(--tx2)}
.take{background:rgba(240,160,75,.07);border:1px solid rgba(240,160,75,.2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ac2);margin-bottom:8px}
.take b{font-weight:650}

/* ---------- misc ---------- */
.empty{text-align:center;padding:40px 20px;color:var(--tx3);font-size:14px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--tx2);margin-bottom:14px}
@media(min-width:720px){
  body{font-size:15.5px}
  .hd{padding:18px 0 16px}
  .view{padding-top:24px}
}
</style>

  <div class="sec-t">今日国家</div>

  <div class="sec-t" id="tdRetailHd">零售速览</div>
  <div id="tdRetail"></div>

  <div class="row" style="margin-top:18px">
    <button class="btn pri full" onclick="startQuiz('due')">开始今日复习</button>
  </div>
  <div class="tiny" style="text-align:center;margin-top:14px;padding-bottom:10px">

<!-- ============ ENGLISH ============ -->
<section class="view" id="v-en">
  <div class="scroller" id="enPills"></div>
  <div id="enBody"></div>
</section>

<!-- ============ WORLD ============ -->
<section class="view" id="v-geo">
  <div id="geoList">
    <div id="globeWrap"><canvas id="globe"></canvas></div>
    <div class="ghint">拖动旋转地球 · 点击亮点查看国家</div>

      <button class="btn" onclick="showCountry(todayCountry().id)">今日国家</button>
      <button class="btn" onclick="randomCountry()">随机一个</button>
    </div>
    <div class="scroller" id="contPills"></div>
    <div id="geoGrid"></div>
  </div>
  <div id="geoDetail" style="display:none"></div>
</section>



<!-- ============ QUIZ ============ -->
<section class="view" id="v-quiz">
  <div id="quizBody"></div>
</section>

</main>

<nav><div class="in">

  <button data-v="en"><svg class="ic" viewBox="0 0 24 24"><path d="M4 5h16M4 5v14M12 5v14"/><path d="M7 9h2M7 13h2M15 9h4M15 13h3"/></svg><span>英语</span></button>

</div></nav>

<script>
"use strict";
/* ============ storage (safe) ============ */
var MEM={};
var ST={
  get:function(k,d){ try{var v=localStorage.getItem("pf_"+k); return v?JSON.parse(v):(MEM[k]!==undefined?MEM[k]:d);}catch(e){return MEM[k]!==undefined?MEM[k]:d;} },
  set:function(k,v){ MEM[k]=v; try{localStorage.setItem("pf_"+k,JSON.stringify(v));}catch(e){} }
};

/* ============ date ============ */
var EPOCH=new Date(2026,0,1);
function today(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
function dayIndex(){return Math.floor((today()-EPOCH)/86400000);}
function ymd(d){d=d||today();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function cnDate(){var d=today(),w="日一二三四五六"[d.getDay()];return (d.getMonth()+1)+" 月 "+d.getDate()+" 日 · 周"+w;}

var SCENES=window.EN_SCENES||[], GEO=window.GEO||[], RETAIL=window.RETAIL||{sections:[]};
function todayScene(){return SCENES[dayIndex()%SCENES.length];}
function todayCountry(){return GEO[(dayIndex()*7+3)%GEO.length];}

/* ============ nav ============ */
var cur="today";
function go(v){
  cur=v;
  document.querySelectorAll(".view").forEach(function(s){s.classList.toggle("on",s.id==="v-"+v);});
  document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.v===v);});
  window.scrollTo(0,0);
}
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){go(b.dataset.v);};});

/* ============ speech ============ */
var VOICE=null;
function pickVoice(){
  try{
    var vs=speechSynthesis.getVoices()||[];
    VOICE=vs.find(function(v){return /en-GB/i.test(v.lang)&&!/google/i.test(v.name)})
        ||vs.find(function(v){return /en-US/i.test(v.lang)})
        ||vs.find(function(v){return /^en/i.test(v.lang)})||null;
  }catch(e){}
}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(t){
  if(!window.speechSynthesis)return;
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(String(t).replace(/\s*\/\s*/g," or "));
    u.lang="en-GB";u.rate=.88;if(VOICE)u.voice=VOICE;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ============ vocab / SRS ============ */
var STEPS=[1,2,4,7,15,30,60];
function vocab(){return ST.get("vocab",{});}
function saveVocab(v){ST.set("vocab",v);}
function keyOf(en){return en.toLowerCase().trim();}
function toggleStar(en,zh,sid){
  var v=vocab(),k=keyOf(en);
  if(v[k]){delete v[k];}
  else{v[k]={en:en,zh:zh,s:sid,lv:0,due:ymd()};}
  saveVocab(v);refreshStats();return !!v[k];
}
function isStar(en){return !!vocab()[keyOf(en)];}
function dueList(){
  var v=vocab(),t=ymd(),out=[];
  for(var k in v){if(!v[k].due||v[k].due<=t)out.push(v[k]);}
  return out;
}
function grade(en,ok){
  var v=vocab(),k=keyOf(en);if(!v[k])return;
  var it=v[k];
  it.lv=ok?Math.min((it.lv||0)+1,STEPS.length-1):0;
  var d=new Date();d.setDate(d.getDate()+STEPS[it.lv]);
  it.due=ymd(d);it.seen=(it.seen||0)+1;
  saveVocab(v);
}
function refreshStats(){
  var v=vocab(),n=0;for(var k in v)n++;
  var e=document.getElementById("stWords");if(e)e.textContent=n;
  e=document.getElementById("stDue");if(e)e.textContent=dueList().length;
  e=document.getElementById("stDone");if(e)e.textContent=(ST.get("seenScenes",[])||[]).length;
}

/* ============ escaping ============ */
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function attr(s){return esc(s).replace(/'/g,"&#39;");}

/* ============ icons ============ */
var IC_SPK='<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
var IC_STAR='<svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.7 6.3.9-4.5 4.4 1 6.3L12 17.4 6.5 20.3l1-6.3L3 9.6l6.3-.9z"/></svg>';

/* ============ TODAY ============ */
function renderToday(){
  document.getElementById("hdDate").textContent=cnDate();
  document.getElementById("hdBadge").textContent="第 "+(dayIndex()+1)+" 天";
  var s=todayScene(),c=todayCountry();
  document.getElementById("tdTitle").textContent=s.title+" · "+c.zh;
  document.getElementById("tdSub").textContent=(RETAIL.sections||[]).length
    ? "今天学一个高频英语场景，认识一个国家，扫一眼零售动向。"
    : "今天学一个高频英语场景，认识一个国家。";

  var nw=s.groups.reduce(function(a,g){return a+g.items.length;},0);
  document.getElementById("tdScene").innerHTML=
    '<div class="eyebrow">Scenario '+((dayIndex()%SCENES.length)+1)+' / '+SCENES.length+'</div>'+
    '<h3 style="font-size:19px">'+esc(s.title)+' <span class="muted" style="font-weight:400;font-size:14px">'+esc(s.en)+'</span></h3>'+
    '<p class="small muted" style="margin:8px 0 12px">'+esc(s.intro)+'</p>'+
    '<div class="row"><span class="chip ac">'+nw+' 个词</span><span class="chip">'+s.phrases.length+' 个句子</span><span class="chip">'+s.groups.length+' 个分类</span></div>';
  document.getElementById("tdScene").onclick=function(){openScene(s.id);};

  document.getElementById("tdGeo").innerHTML=
    '<div style="display:flex;gap:14px;align-items:center"><div class="cflag">'+c.flag+'</div>'+
    '<div><h3 style="font-size:19px">'+esc(c.zh)+'</h3><div class="tiny">'+esc(c.en)+' · '+esc(c.cont)+' · '+esc(c.capital)+'</div></div></div>'+
    '<p class="small muted" style="margin:12px 0 0">'+esc(c.geo.slice(0,88))+'…</p>';
  document.getElementById("tdGeo").onclick=function(){showCountry(c.id);};

  var rEl=document.getElementById("tdRetail");

var Q={pool:[],i:0,ok:0,mode:""};
function poolFor(mode){
  var out=[];
  if(mode==="due"){out=dueList().map(function(v){return [v.en,v.zh];});
    if(!out.length){var v=vocab();for(var k in v)out.push([v[k].en,v[k].zh]);}
  }else if(mode==="star"){var v2=vocab();for(var k2 in v2)out.push([v2[k2].en,v2[k2].zh]);}
  else{
    var s=SCENES.filter(function(x){return x.id===mode;})[0];
    if(s){s.groups.forEach(function(g){g.items.forEach(function(i){out.push([i[0],i[1]]);});});
          s.phrases.slice(0,8).forEach(function(p){out.push([p[0],p[1]]);});}
  }
  if(!out.length){SCENES.forEach(function(s){s.groups.forEach(function(g){g.items.forEach(function(i){out.push([i[0],i[1]]);});});});}
  return out;
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function startQuiz(mode){
  var all=poolFor(mode);
  if(!all.length){alert("还没有可测验的内容，先去英语板块收藏几个词。");return;}
  Q.all=all;Q.pool=shuffle(all).slice(0,Math.min(10,all.length));Q.i=0;Q.ok=0;Q.mode=mode;
  go("quiz");nextQ();
}
function nextQ(){
  var body=document.getElementById("quizBody");

    var pct=Math.round(Q.ok/Q.pool.length*100);

      '<div style="font-size:44px;font-weight:750;color:var(--ac2);margin:10px 0">'+pct+'%</div>'+
      '<div class="muted">答对 '+Q.ok+' / '+Q.pool.length+'</div>'+
      '<p class="small muted" style="margin:16px 0 0">答错的词已加入生词本，会按 1·2·4·7·15·30 天的间隔安排复习。</p></div>'+
      '<div class="row"><button class="btn full" onclick="startQuiz(\''+attr(Q.mode)+'\')">再来一轮</button></div>'+
      '<div class="row" style="margin-top:9px"><button class="btn full" onclick="go(\'today\')">回到今日</button></div>';
    refreshStats();return;
  }
  var q=Q.pool[Q.i];
  var wrong=shuffle(Q.all.filter(function(x){return x[1]!==q[1];})).slice(0,3);
  var opts=shuffle([q].concat(wrong));
  var enToZh=Q.i%2===0;
  body.innerHTML='<div class="prog"><i style="width:'+(Q.i/Q.pool.length*100)+'%"></i></div>'+
    '<div class="tiny" style="margin-bottom:14px">第 '+(Q.i+1)+' / '+Q.pool.length+' 题</div>'+
    '<div class="card qbox"><div class="eyebrow">'+(enToZh?"这句/这个词是什么意思":"用英语怎么说")+'</div>'+
    '<div class="qq">'+esc(enToZh?q[0]:q[1])+'</div>'+
    (enToZh?'<button class="btn" onclick="say(\''+attr(q[0]).replace(/\\/g,"")+'\')">'+IC_SPK+' 听一遍</button>':'')+'</div>'+
    '<div id="opts">'+opts.map(function(o,i){
      return '<button class="opt" data-i="'+i+'" data-ok="'+(o[1]===q[1]?1:0)+'">'+esc(enToZh?o[1]:o[0])+'</button>';
    }).join("")+'</div>';
  document.querySelectorAll("#opts .opt").forEach(function(b){
    b.onclick=function(){
      if(b.dataset.done)return;
      document.querySelectorAll("#opts .opt").forEach(function(x){x.dataset.done=1;
        if(x.dataset.ok==="1")x.classList.add("right");});
      var ok=b.dataset.ok==="1";
      if(!ok)b.classList.add("wrong");else Q.ok++;
      if(!ok){var v=vocab(),k=keyOf(q[0]);if(!v[k]){v[k]={en:q[0],zh:q[1],lv:0,due:ymd()};saveVocab(v);}}
      grade(q[0],ok);
      if(ok)say(q[0]);
      setTimeout(function(){Q.i++;nextQ();},ok?700:1400);
    };
  });
}

/* ============ WORLD: globe ============ */
var G={rot:20,tilt:-12,drag:false,px:0,py:0,land:null,r:0,cx:0,cy:0,spin:true};
var cv=document.getElementById("globe"),ctx=cv.getContext("2d");
function sizeGlobe(){
  var w=cv.parentNode.clientWidth||360,dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=w*dpr;cv.height=w*dpr;cv.style.height=w+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  G.r=w*0.42;G.cx=w/2;G.cy=w/2;
}
function proj(lat,lon){
  var p=(lat)*Math.PI/180, l=(lon+G.rot)*Math.PI/180, t=G.tilt*Math.PI/180;
  var x=Math.cos(p)*Math.sin(l);
  var y=Math.cos(t)*Math.sin(p)-Math.sin(t)*Math.cos(p)*Math.cos(l);
  var z=Math.sin(t)*Math.sin(p)+Math.cos(t)*Math.cos(p)*Math.cos(l);
  return {x:G.cx+x*G.r, y:G.cy-y*G.r, v:z>0, z:z};
}
function drawGlobe(){
  var w=cv.clientWidth||360;
  ctx.clearRect(0,0,w,w);
  // atmosphere
  var ag=ctx.createRadialGradient(G.cx,G.cy,G.r*.92,G.cx,G.cy,G.r*1.16);
  ag.addColorStop(0,"rgba(106,169,240,.16)");ag.addColorStop(1,"rgba(106,169,240,0)");
  ctx.fillStyle=ag;ctx.beginPath();ctx.arc(G.cx,G.cy,G.r*1.16,0,7);ctx.fill();
  // ocean
  var og=ctx.createRadialGradient(G.cx-G.r*.35,G.cy-G.r*.4,G.r*.1,G.cx,G.cy,G.r);
  og.addColorStop(0,"#1d3348");og.addColorStop(.65,"#132434");og.addColorStop(1,"#0d1a26");
  ctx.fillStyle=og;ctx.beginPath();ctx.arc(G.cx,G.cy,G.r,0,7);ctx.fill();
  ctx.strokeStyle="rgba(106,169,240,.28)";ctx.lineWidth=1;ctx.stroke();
  // graticule
  ctx.strokeStyle="rgba(140,175,210,.13)";ctx.lineWidth=.8;
  for(var lat=-60;lat<=60;lat+=30){
    ctx.beginPath();var st=false;
    for(var lo=-180;lo<=180;lo+=4){var p=proj(lat,lo);
      if(p.v){if(!st){ctx.moveTo(p.x,p.y);st=true;}else ctx.lineTo(p.x,p.y);}else st=false;}
    ctx.stroke();
  }
  for(var lon=-180;lon<180;lon+=30){
    ctx.beginPath();var st2=false;
    for(var la=-90;la<=90;la+=4){var q=proj(la,lon);
      if(q.v){if(!st2){ctx.moveTo(q.x,q.y);st2=true;}else ctx.lineTo(q.x,q.y);}else st2=false;}
    ctx.stroke();
  }
  // land (if loaded)
  if(G.land){
    ctx.fillStyle="rgba(96,132,112,.55)";ctx.strokeStyle="rgba(150,200,175,.5)";ctx.lineWidth=.7;
    G.land.forEach(function(poly){
      var started=false,any=false;ctx.beginPath();
      for(var i=0;i<poly.length;i++){
        var p=proj(poly[i][1],poly[i][0]);
        if(p.v){any=true;if(!started){ctx.moveTo(p.x,p.y);started=true;}else ctx.lineTo(p.x,p.y);}
        else{started=false;}
      }
      if(any){ctx.closePath();ctx.fill();ctx.stroke();}
    });
  }
  // markers
  GEO.forEach(function(c){
    var p=proj(c.lat,c.lon);if(!p.v)return;
    var a=Math.max(.25,p.z);
    ctx.beginPath();ctx.arc(p.x,p.y,5.5,0,7);
    ctx.fillStyle="rgba(240,160,75,"+(a*.22)+")";ctx.fill();
    ctx.beginPath();ctx.arc(p.x,p.y,2.6,0,7);
    ctx.fillStyle="rgba(255,200,130,"+a+")";ctx.fill();
  });
}
function hitCountry(mx,my){
  var best=null,bd=1e9;
  GEO.forEach(function(c){
    var p=proj(c.lat,c.lon);if(!p.v)return;
    var d=Math.hypot(p.x-mx,p.y-my);
    if(d<20&&d<bd){bd=d;best=c;}
  });
  return best;
}
function ptOf(e){
  var r=cv.getBoundingClientRect();
  var t=e.touches?e.touches[0]:e;
  return {x:t.clientX-r.left,y:t.clientY-r.top};
}
var moved=0;
function dStart(e){G.drag=true;G.spin=false;moved=0;var p=ptOf(e);G.px=p.x;G.py=p.y;}
function dMove(e){
  if(!G.drag)return;e.preventDefault();
  var p=ptOf(e);var dx=p.x-G.px,dy=p.y-G.py;
  moved+=Math.abs(dx)+Math.abs(dy);
  G.rot+=dx*0.32;G.tilt=Math.max(-80,Math.min(80,G.tilt+dy*0.28));
  G.px=p.x;G.py=p.y;drawGlobe();
}
function dEnd(e){
  if(G.drag&&moved<6){
    var p=ptOf(e.changedTouches?{touches:e.changedTouches}:e);
    var c=hitCountry(p.x,p.y);if(c)showCountry(c.id);
  }
  G.drag=false;setTimeout(function(){G.spin=true;},2600);
}
cv.addEventListener("mousedown",dStart);window.addEventListener("mousemove",dMove);window.addEventListener("mouseup",dEnd);
cv.addEventListener("touchstart",dStart,{passive:true});
cv.addEventListener("touchmove",dMove,{passive:false});
cv.addEventListener("touchend",dEnd);
function tick(){if(G.spin&&cur==="geo"&&document.getElementById("geoDetail").style.display==="none"){G.rot+=0.055;drawGlobe();}requestAnimationFrame(tick);}

/* optional: real coastlines from CDN, silently skipped if offline */
function loadLand(){
  var urls=["https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json",
            "https://unpkg.com/world-atlas@2/land-110m.json"];
  (function tryNext(i){
    if(i>=urls.length)return;
    fetch(urls[i]).then(function(r){return r.ok?r.json():Promise.reject();}).then(function(topo){
      var o=topo.objects.land, tr=topo.transform, arcs=topo.arcs;
      function decode(arc){
        var x=0,y=0,out=[];
        for(var i2=0;i2<arc.length;i2++){
          x+=arc[i2][0];y+=arc[i2][1];
          out.push([x*tr.scale[0]+tr.translate[0], y*tr.scale[1]+tr.translate[1]]);
        }
        return out;
      }
      var cache=arcs.map(decode);
      function ring(idx){
        var out=[];
        idx.forEach(function(a){
          var rev=a<0, ar=cache[rev?~a:a].slice();
          if(rev)ar.reverse();
          if(out.length)ar.shift();
          out=out.concat(ar);
        });
        return out;
      }
      var polys=[];
      function walk(g){
        if(g.type==="Polygon")g.arcs.forEach(function(r){polys.push(ring(r));});
        else if(g.type==="MultiPolygon")g.arcs.forEach(function(p){p.forEach(function(r){polys.push(ring(r));});});
        else if(g.geometries)g.geometries.forEach(walk);
      }
      walk(o);
      G.land=polys.filter(function(p){return p.length>6;});
      drawGlobe();
    }).catch(function(){tryNext(i+1);});
  })(0);
}

  if(RETAIL.archive&&RETAIL.archive.length){
    h+='<div class="sec-t">往期归档</div><div class="card">'+RETAIL.archive.map(function(a){
      return '<div class="ri"><h4>'+esc(a.t)+'</h4><p>'+esc(a.body)+'</p><div class="tiny">'+esc(a.date||"")+'</div></div>';
    }).join("")+'</div>';
  }
  h+='<div style="height:24px"></div>';
  box.innerHTML=h;
}

/* ============ boot ============ */
function boot(){
  renderToday();
  curScene=todayScene().id;renderPills();openScene(curScene);go("today");
  renderGeoList();renderRetail();
  sizeGlobe();drawGlobe();tick();loadLand();
  window.addEventListener("resize",function(){sizeGlobe();drawGlobe();});
}
boot();
</script>
